[workspace]
members = [
  "crates/sourcefield-core",
  "crates/sourcefield-collector",
  "crates/sourcefield-render",
  "crates/sourcefield-cli",
  "crates/sourcefield-wasm",
  "crates/sourcefield-workspace",
  "crates/sourcefield-io",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
authors = ["Dominic <kdominic89@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/kdominic89/sourcefield"

[workspace.dependencies]
anyhow = "=1.0.104"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "=4.6.7", features = ["derive"] }
hex = "=0.4.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
thiserror = "=2.0.21"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "time"] }
toml = "=1.1.6"
wasm-bindgen = "=0.2.129"

sourcefield-core = { path = "crates/sourcefield-core" }
sourcefield-collector = { path = "crates/sourcefield-collector" }
sourcefield-render = { path = "crates/sourcefield-render" }

sourcefield-workspace = { path = "crates/sourcefield-workspace" }

sourcefield-io = { path = "crates/sourcefield-io" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Native rendering favors throughput; the browser module remains size optimized.
[profile.release.package.sourcefield-wasm]
opt-level = "s"
