<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#050812">
  <meta name="description" content="An interactive field of projects, packages, and capabilities.">
  <title>SOURCEFIELD</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="./site.webmanifest">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <main class="shell" aria-label="Interactive SOURCEFIELD profile">
    <header class="topbar">
      <a class="identity" href="#" rel="noreferrer">
        <span class="identity-mark" aria-hidden="true"></span>
        <span>
          <b>SOURCEFIELD</b>
          <small>/ PROFILE</small>
        </span>
      </a>

      <nav class="view-switch" aria-label="Visualization layer">
        <button class="segmented is-active" data-layer="overview" type="button">Field</button>
        <button class="segmented" data-layer="systems" type="button">Systems</button>
        <button class="segmented" data-layer="capabilities" type="button">Capabilities</button>
      </nav>

      <div class="actions">
        <label class="history-label">History
          <select id="history-select" aria-label="Historical graph state"><option value="">Current</option></select>
        </label>
        <button id="domain-button" class="quiet-button" type="button" aria-label="Change namespace filter">
          <span class="status-dot"></span><span id="domain-label">All namespaces</span>
        </button>
        <button id="motion-button" class="icon-button" type="button" aria-label="Pause motion" title="Pause motion">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12M16 6v12"/></svg>
        </button>
        <button id="reset-button" class="icon-button" type="button" aria-label="Reset view" title="Reset view">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.6M4 4v4.6h4.6"/></svg>
        </button>
      </div>
    </header>

    <section class="stage profile-mode" id="stage" aria-label="Interactive project topology">
      <div id="profile-view" aria-label="Profile field"></div>
      <canvas id="gl-canvas" aria-hidden="true"></canvas>
      <canvas id="label-canvas" aria-hidden="true"></canvas>
      <div class="stage-vignette" aria-hidden="true"></div>

      <div class="intro" id="intro">
        <span class="eyebrow">Projects and capabilities.</span>
        <h1>Project field</h1>
        <p>Explore projects, packages, and languages.</p>
      </div>

      <div class="field-meta mono" aria-live="polite">
        <span id="engine-label">INITIALIZING FIELD</span>
        <span id="state-label">STATE</span>
      </div>

      <div class="gesture-hint mono" id="gesture-hint">DRAG TO MOVE / SCROLL TO ZOOM / SELECT A NODE</div>

      <aside class="detail-panel" id="detail-panel" aria-hidden="true" inert aria-label="Signal details">
        <button id="detail-close" class="icon-button panel-close" type="button" aria-label="Close details">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
        </button>
        <div class="detail-kind mono" id="detail-kind"></div>
        <h2 id="detail-title"></h2>
        <p id="detail-summary"></p>
        <div class="detail-tags" id="detail-tags"></div>
        <ul id="detail-list"></ul>
        <a id="detail-link" class="detail-link" href="#" rel="noreferrer">Open public source <span>&#8599;</span></a>
      </aside>
    </section>

    <section class="semantic-profile" aria-label="Project details">
      <p id="mobile-identity"></p>
      <p id="data-status" class="mono"></p>
      <details>
        <summary>Projects and capabilities</summary>
        <ul id="node-list"></ul>
        <div id="profile-context"></div>
      </details>
    </section>

    <footer class="footer mono">
      <div class="metrics" id="metrics"></div>
      <div class="footer-links"></div>
    </footer>
  </main>

  <noscript>This interactive topology requires JavaScript. The profile README contains a fully static SVG fallback.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
