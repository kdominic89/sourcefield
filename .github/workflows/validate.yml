name: Validate Sourcefield
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the repository-pinned toolchain
        run: rustup show active-toolchain
      - name: Install the pinned WASM packager
        run: cargo install wasm-pack --version "$(python3 scripts/tool_versions.py --version)" --locked
      - name: Build the complete WASM runtime
        run: bash scripts/build-wasm.sh
      - name: Verify native, WASM, Python, browser modules and API documentation
        run: bash scripts/verify.sh
      - name: Provision the pinned existing browser test tool
        run: |
          mkdir -p "$RUNNER_TEMP/browser-tools"
          cp tools/browser/package.json tools/browser/package-lock.json "$RUNNER_TEMP/browser-tools/"
          npm ci --prefix "$RUNNER_TEMP/browser-tools" --include=dev --ignore-scripts --no-audit --no-fund
          node "$RUNNER_TEMP/browser-tools/node_modules/playwright/cli.js" install --with-deps --no-shell chromium
      - name: Allow the bundled browser sandbox for its exact executable
        run: |
          browser="$(node --input-type=module - "$RUNNER_TEMP/browser-tools/node_modules/playwright/index.mjs" <<'JS'
          import { pathToFileURL } from 'node:url';
          const { chromium } = await import(pathToFileURL(process.argv[2]).href);
          process.stdout.write(chromium.executablePath());
          JS
          )"

          # The policy and launch must select the same full Chromium, not the default headless shell.
          python3 scripts/browser_sandbox_policy.py "$browser" > "$RUNNER_TEMP/sourcefield-playwright.apparmor"
          sudo install -o root -g root -m 0644 "$RUNNER_TEMP/sourcefield-playwright.apparmor" \
            /etc/apparmor.d/sourcefield-playwright
          sudo apparmor_parser --replace /etc/apparmor.d/sourcefield-playwright
          printf 'SOURCEFIELD_BROWSER=%s\n' "$browser" >> "$GITHUB_ENV"
      - name: Verify actual WASM/browser behavior for both variants and multiple organizations
        run: |
          cargo build --locked -p sourcefield-cli
          python3 scripts/verify_publication.py --binary target/debug/sourcefield
          python3 scripts/release_browser_fixtures.py --binary target/debug/sourcefield \
            --output "$RUNNER_TEMP/browser-fixtures" \
            --playwright-module "$RUNNER_TEMP/browser-tools/node_modules/playwright/index.mjs" \
            --browser "$SOURCEFIELD_BROWSER"
      - name: Retain browser evidence for review and failed-gate diagnosis
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sourcefield-browser-verification
          path: ${{ runner.temp }}/browser-fixtures/evidence
          if-no-files-found: warn
          retention-days: 14

  native-platforms:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify native workspace on the actual platform
        run: |
          rustup show active-toolchain
          cargo test --workspace --all-targets --locked
          cargo build --locked -p sourcefield-cli
      - name: Check portable distribution paths and Python boundaries
        run: |
          python -B -m unittest discover -s tests -p 'test_distribution*.py'
          python -B -m unittest discover -s tests -p 'test_shared_artifacts.py'
          python -B -m unittest discover -s tests -p 'test_transport_contracts.py'
          python -B -m unittest discover -s tests -p 'test_python_structure.py'
