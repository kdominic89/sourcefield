name: Release Sourcefield
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version matching Cargo.toml, without the v prefix'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sourcefield-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  prepare:
    # Fail invalid dispatches visibly; repeat the owner guard in publish for publish-only retries.
    if: github.repository == 'kdominic89/sourcefield'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Require an owner dispatch on main
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RELEASE_OWNER: ${{ github.repository_owner }}
        run: |
          if [[ "$RELEASE_REF" != refs/heads/main ]]; then
            printf '%s\n' 'Release dispatch must select main.' >&2
            exit 1
          fi

          if [[ "$RELEASE_ACTOR" != "$RELEASE_OWNER" || "$RELEASE_TRIGGERING_ACTOR" != "$RELEASE_OWNER" ]]; then
            printf '%s\n' 'Only the repository owner may start or retry a release.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate the version and require an unused tag before building
        id: version
        env:
          RELEASE_TAG: v${{ inputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_manifest.py --release "$RELEASE_TAG" --check-version
          python3 scripts/release_publish.py --check-unpublished --repository "$RELEASE_REPOSITORY" --release "$RELEASE_TAG"
          printf 'release=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
  verify:
    needs: prepare
    uses: ./.github/workflows/validate.yml
  native:
    needs: [prepare, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            executable: sourcefield
            python: python3
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            executable: sourcefield
            python: python3
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: sourcefield
            python: python3
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            executable: sourcefield
            python: python3
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            executable: sourcefield.exe
            python: python
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build and test on the target platform
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          SOURCEFIELD_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          rustup show active-toolchain
          cargo test --workspace --locked
          cargo build --release --locked -p sourcefield-cli --target "$RELEASE_TARGET"
      - name: Smoke test the actual release executable and package it
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_EXECUTABLE: ${{ matrix.executable }}
          RELEASE_PYTHON: ${{ matrix.python }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          "target/$RELEASE_TARGET/release/$RELEASE_EXECUTABLE" --help
          "target/$RELEASE_TARGET/release/$RELEASE_EXECUTABLE" --version
          "$RELEASE_PYTHON" scripts/release_package.py --target "$RELEASE_TARGET" --binary "target/$RELEASE_TARGET/release/$RELEASE_EXECUTABLE" --source-commit "$SOURCE_COMMIT" --release "$RELEASE_TAG"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  browser:
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: cargo install wasm-pack --version "$(python3 scripts/tool_versions.py --version)" --locked
      - run: bash scripts/build-wasm.sh
        env:
          SOURCEFIELD_SOURCE_COMMIT: ${{ github.sha }}
      - name: Package the complete runtime from the same source commit
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/release_package.py --target browser --source-commit "$SOURCE_COMMIT" --release "$RELEASE_TAG"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-browser
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    # A publish-only retry reuses prepare, so its current actor needs the same authorization.
    if: >-
      github.repository == 'kdominic89/sourcefield' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    needs: [prepare, native, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify the complete matrix and write release metadata
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/release_manifest.py --directory dist --source-commit "$SOURCE_COMMIT" --release "$RELEASE_TAG"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/sourcefield.lock.json
            dist/SHA256SUMS
      - name: Upload a complete draft, then create its tag and publish it immutably
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release }}
          SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          SOURCEFIELD_IMMUTABLE_RELEASES: ${{ vars.SOURCEFIELD_IMMUTABLE_RELEASES }}
        run: python3 scripts/release_publish.py --directory dist --source-commit "$SOURCE_COMMIT" --release "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY"
